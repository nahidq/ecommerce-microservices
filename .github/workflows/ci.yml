name: CI

on:
  push:
    branches: [main]
  pull_request:
jobs:
  product-service:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
           build-essential cmake  pkg-config libpqxx-dev libasio-dev
      - name: Configure
        run: cmake -S product_service -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure
  docker-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t product-service:ci  product_service